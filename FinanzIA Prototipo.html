    for(const n of [3,4]) for(let i=0;i+n<=p.length;i++){ const g=p.slice(i,i+n); out[g]=(out[g]||0)+1; } }
  return out;
}
function buildIdf(docs){
  const df={}; docs.forEach(d=>Object.keys(d).forEach(g=>df[g]=(df[g]||0)+1));
  const N=docs.length, idf={}; for(const g in df) idf[g]=Math.log((1+N)/(1+df[g]))+1;
  return {idf, unk:Math.log(1+N)+1};
}
function vec(counts, I){
  const v={}; let s=0;
  for(const g in counts){ const x=counts[g]*(I.idf[g]??I.unk); v[g]=x; s+=x*x; }
  s=Math.sqrt(s)||1; for(const g in v) v[g]/=s; return v;
}
function cos(a,b){ let s=0; const [x,y]=Object.keys(a).length<Object.keys(b).length?[a,b]:[b,a]; for(const g in x) if(y[g]) s+=x[g]*y[g]; return s; }
const KW = {
  ALI:["almuerzo","mercado","desayuno","empanada","tinto","pan","leche","arepa","fruta","verdura","pollo","carne","corrientazo","gaseosa"],
  TRA:["uber","taxi","sitp","transmilenio","gasolina","pasaje","picap","didi","parqueadero","peaje","moto","bus"],
  VIV:["arriendo","factura","recibo","internet","agua","luz","energia","gas","administracion","plan"],
  SAL:["drogueria","medicamento","cita","eps","odontologia","farmacia","medico"],
  EDU:["semestre","curso","cuaderno","fotocopia","universidad","libro","clase"],
  OCI:["netflix","spotify","cine","rumba","cerveza","bolos","pola","juego"],
  HOG:["jabon","detergente","peluqueria","shampoo","ropa","gimnasio","casa"],
  TRB:["canva","hosting","coworking","adobe","mercancia","cliente","trabajo"]
};
function keyword(t){ const w=clean(t).split(" "); for(const c in KW) if(KW[c].some(k=>w.some(x=>x.startsWith(k)))) return c; return null; }


// ---------- Modelo del agente ----------
const DOCS = TRAIN.map(r=>grams(clean(r[2])));
const IDF = buildIdf(DOCS);
const TV = DOCS.map(d=>vec(d,IDF));
const MEM_UMBRAL = 0.8, DUDA_UMBRAL = 0.25, K = 5;
const DIAS_RESTANTES = 11, HOY = 21;
const TOPES = {ALI:600000, TRA:200000, OCI:180000, TRB:300000};
const HIST = {ALI:380000, TRA:120000, OCI:110000, HOG:60000, TRB:150000, SAL:40000, EDU:50000, VIV:60000};
const HORMIGA_MAX = 10000, HORMIGA_UMBRAL = 20000;
const fmt = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Math.round(n));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function initialState(){

    gastos:[
      {d:2,t:"Mercado quincenal en el D1",v:165000,c:"ALI",src:"ejemplo"},
      {d:3,t:"Suscripción Canva Pro",v:32000,c:"TRB",src:"ejemplo"},

      {d:14,t:"Hosting página del cliente",v:95000,c:"TRB",src:"ejemplo"},
      {d:15,t:"Medicamentos en la droguería",v:28000,c:"SAL",src:"ejemplo"},
      {d:16,t:"Empanada y gaseosa",v:6500,c:"ALI",src:"ejemplo"},

      {d:20,t:"Uber al centro",v:21000,c:"TRA",src:"ejemplo"},
      {d:20,t:"Tinto en la esquina",v:4500,c:"ALI",src:"ejemplo"}
    ],
    memory:[], alerts:[], stats:{eval:0,knnOk:0,kwOk:0,corr:0,doubt:0,memUse:0,memOk:0},
    pending:null, toast:null, err:null
  };
}
let S = initialState();

function poolCats(){ return Object.keys(CATS).filter(c=>S.perfil==="free"||c!=="TRB"); }

function classify(text){
  const q = vec(grams(clean(text)), IDF);
  const allowed = new Set(poolCats());
  const memN = S.memory.filter(m=>allowed.has(m.c)).map(m=>({t:m.t,c:m.c,src:"mem",sim:cos(q,m.v)})).sort((a,b)=>b.sim-a.sim);
  const trN = TRAIN.map((r,i)=>({t:r[2],c:r[0],src:r[1],sim:cos(q,TV[i])})).filter(n=>allowed.has(n.c));
  const kwc = keyword(text); const kw = kwc && allowed.has(kwc) ? kwc : null;
  if(memN.length && memN[0].sim>=MEM_UMBRAL){
    return {cat:memN[0].c, source:"mem", neighbors:[memN[0], ...trN.sort((a,b)=>b.sim-a.sim).slice(0,2)], kw};
  }
  const all = trN.concat(memN).sort((a,b)=>b.sim-a.sim);
  const top = all.slice(0,K);
  const score = {}; top.forEach(n=>score[n.c]=(score[n.c]||0)+n.sim);
  const best = Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
  const source = (!top.length || top[0].sim<DUDA_UMBRAL) ? "doubt" : "knn";
  return {cat: best?best[0]:null, source, neighbors: top.slice(0,3), kw};
}

function totals(){
  const ing = S.ingresos.reduce((a,x)=>a+x.v,0);
  const gas = S.gastos.reduce((a,x)=>a+x.v,0);
  const ob = S.oblig.reduce((a,x)=>a+x.v,0);
  const res = S.perfil==="free" ? ing*S.reservaPct/100 : 0;
  const byCat = {}; Object.keys(CATS).forEach(c=>byCat[c]=0); S.gastos.forEach(g=>byCat[g.c]+=g.v);
  const pdr = ing - ob - res - S.meta - gas;
  return {ing,gas,ob,res,byCat,pdr,dia:Math.max(0,pdr)/DIAS_RESTANTES};
}

function upsertAlert(key, a){
  const ex = S.alerts.find(x=>x.key===key);
  if(ex){ Object.assign(ex, a); } else { S.alerts.unshift({key, fb:null, seen:false, ...a}); }
}
function evalRules(){
  const T = totals();
  for(const c in TOPES){ if(T.byCat[c]>TOPES[c]) upsertAlert("R1-"+c,{rule:"R1",title:`Superaste el tope de ${CATS[c]}`,msg:`Llevas ${fmt(T.byCat[c])} este mes y tu tope es ${fmt(TOPES[c])}.`,why:`SI gasto(${CATS[c]}) ${fmt(T.byCat[c])} > tope ${fmt(TOPES[c])}`}); }
  for(const c in HIST){ if(T.byCat[c]>1.3*HIST[c]){ const pct=Math.round((T.byCat[c]/HIST[c]-1)*100);
    upsertAlert("R2-"+c,{rule:"R2",title:`${CATS[c]} subió ${pct} %`,msg:`A esta fecha sueles llevar ${fmt(HIST[c])} en ${CATS[c]} y hoy vas en ${fmt(T.byCat[c])}.`,why:`SI gasto a la fecha > 1,3 × promedio (${fmt(1.3*HIST[c])})`}); } }
  const sem = S.gastos.filter(g=>g.d>=HOY-6 && g.v<HORMIGA_MAX && g.c!=="TRB");
  const sum = sem.reduce((a,g)=>a+g.v,0);
  if(sum>HORMIGA_UMBRAL) upsertAlert("R3",{rule:"R3",title:"Gastos hormiga esta semana",msg:`Llevas ${fmt(sum)} en ${sem.length} gastos de menos de ${fmt(HORMIGA_MAX)} en los últimos 7 días. Al mes serían unos ${fmt(sum*30/7)}.`,why:`SI suma(gastos < ${fmt(HORMIGA_MAX)}, 7 días) ${fmt(sum)} > ${fmt(HORMIGA_UMBRAL)}`});
}

function setTab(t){ S.tab=t; if(t==="ale") S.alerts.forEach(a=>a.seen=true); render(); window.scrollTo({top:0}); }
function submit(){
  const t = document.getElementById("in-desc").value.trim();
  const v = parseInt(document.getElementById("in-monto").value.replace(/\D/g,""),10);
  if(!t){ S.err="Escribe una descripción corta, por ejemplo “almuerzo”."; render(); return; }
  if(!v){ S.err="Escribe el monto en pesos, por ejemplo 15000."; render(); return; }
  S.err=null; S.toast=null;
  if(S.tipo==="Ingreso"){
    S.ingresos.push({d:HOY,t,v,src:"tú"});
    if(S.perfil==="free"){ const r=v*S.reservaPct/100;
      upsertAlert("R4-"+S.ingresos.length,{rule:"R4",title:"Entró un pago: separa la reserva",msg:`Recibiste ${fmt(v)}. Antes de gastar, aparta ${fmt(r)} (${S.reservaPct} %) para PILA e impuestos. Lo demás repártelo como un sueldo mensual.`,why:`SI perfil = freelance Y entra un ingreso`}); }
    evalRules();
    S.toast=`Ingreso de ${fmt(v)} registrado. El presupuesto se recalculó.`;
    render(); return;
  }
  const res = classify(t);
  S.pending = {t, v, res, sel: res.source==="doubt"?null:res.cat};
  render();
  const el=document.getElementById("agent-card"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}
function confirmPending(){
  const P = S.pending; if(!P||!P.sel) return;
  const st = S.stats; st.eval++;
  const ok = P.res.source!=="doubt" && P.sel===P.res.cat;
  if(P.res.source==="doubt") st.doubt++; else if(ok) st.knnOk++; else st.corr++;
  if(P.res.source==="mem"){ st.memUse++; if(ok) st.memOk++; }
  if(P.res.kw===P.sel) st.kwOk++;
  // Primero se evalúa, después se aprende
  const corrected = P.res.source==="doubt" || !ok;
  S.memory.unshift({t:P.t, c:P.sel, v:vec(grams(clean(P.t)),IDF), corrected});
  S.gastos.push({d:HOY,t:P.t,v:P.v,c:P.sel,src:P.res.source,corrected});
  const before = S.alerts.length;
  evalRules();
  const nuevas = S.alerts.length-before;
  S.toast = (corrected ? `Guardado en ${CATS[P.sel]}. Lo anoté en tu memoria: la próxima vez lo sugiero así.` : `Guardado en ${CATS[P.sel]}.`) + (nuevas? ` Hay ${nuevas} alerta${nuevas>1?"s":""} nueva${nuevas>1?"s":""}.`:"");
  S.pending=null; render();
}

        </div>
      </div>`).join("") : `<p class="empty">Todavía no hay alertas.</p>`}
    <p class="small muted">${rated?`Alertas útiles: ${util} de ${rated} calificadas (${Math.round(util/rated*100)} %). Es una de las métricas del piloto.`:"Califica las alertas: el porcentaje de alertas útiles es una métrica del piloto."}</p>
  </section>
  <section class="card" aria-labelledby="t-rules">
    <h2 id="t-rules">Base de conocimiento</h2>
    <p class="rule">R1 · SI el gasto de una categoría supera su tope ENTONCES avisar</p>
    <p class="rule">R2 · SI una categoría va 30 % por encima de su promedio a la misma fecha ENTONCES avisar que subió</p>
    <p class="rule">R3 · SI los gastos personales de menos de ${fmt(HORMIGA_MAX)} suman más de ${fmt(HORMIGA_UMBRAL)} en 7 días ENTONCES avisar gastos hormiga</p>
    <p class="rule">R4 · SI el perfil es freelance Y entra un ingreso ENTONCES recomendar apartar la reserva</p>
  </section>`;
}
function viewApr(){
  const st = S.stats; const ev = st.eval;
  const pct = n => ev? Math.round(n/ev*100)+" %" : "—";
  const nd = TRAIN.filter(r=>r[1]==="d").length, nn = TRAIN.length-nd;
  return `
  <section class="card" aria-labelledby="t-met">
    <span class="label">Evaluado antes de guardar cada corrección</span>
    <h2 id="t-met">Métricas de esta sesión</h2>
    <div class="stats">
      <div class="stat"><span class="n">${ev}</span><span class="d">gastos clasificados</span></div>
      <div class="stat"><span class="n">${pct(st.knnOk)}</span><span class="d">aciertos del agente</span></div>
      <div class="stat"><span class="n">${pct(st.kwOk)}</span><span class="d">aciertos de palabras clave</span></div>
      <div class="stat"><span class="n">${pct(st.corr+st.doubt)}</span><span class="d">tasa de corrección (incluye ${st.doubt} duda${st.doubt===1?"":"s"})</span></div>
    </div>
    <p class="small muted">${st.memUse?`La memoria decidió ${st.memUse} ve${st.memUse===1?"z":"ces"} y acertó ${st.memOk}.`:"Cuando corrijas un gasto y lo vuelvas a registrar, verás aquí cuántas veces decidió la memoria."}</p>
  </section>
  <section class="card" aria-labelledby="t-memo">
    <h2 id="t-memo">Tu memoria personal</h2>
    <p class="small muted">Lo que confirmas o corriges queda aquí. KNN no se reentrena: la corrección es un ejemplo nuevo que gana cuando escribes algo parecido.</p>
    <div class="list">${S.memory.length? S.memory.map((m,i)=>`<div class="mem-item"><div><b>${esc(m.t)}</b> → ${CATS[m.c]} ${m.corrected?'<span class="pill warn">corrección</span>':""}</div><button type="button" data-rm="${i}">Quitar</button></div>`).join("") : `<p class="empty">Vacía. Registra y confirma un gasto para llenarla.</p>`}</div>
  </section>
  <section class="card" aria-labelledby="t-cic">
    <h2 id="t-cic">Ciclo del agente</h2>
    <div class="cycle">
      <div class="st"><span class="num">1</span><p><b>Percibe</b> la descripción, el monto y el tipo que escribes.</p></div>
      <div class="st"><span class="num">2</span><p><b>Busca</b> en tu memoria; si no hay nada parecido, busca los 5 ejemplos más cercanos (distancia coseno sobre pedazos de 3 y 4 letras).</p></div>
      <div class="st"><span class="num">3</span><p><b>Decide</b> la categoría por votación; si el más parecido está por debajo de ${Math.round(DUDA_UMBRAL*100)} %, dice que no está seguro.</p></div>
      <div class="st"><span class="num">4</span><p><b>Actúa</b>: recalcula el presupuesto y revisa las reglas de alertas.</p></div>
      <div class="st"><span class="num">5</span><p><b>Aprende</b>: guarda tu confirmación o corrección en la memoria.</p></div>
    </div>
    <p class="small muted">Ejemplos de entrenamiento: ${TRAIN.length} frases distintas (${nd} de su dataset, sin repeticiones, y ${nn} agregadas para cubrir Salud, Educación, Hogar y Trabajo).</p>
  </section>
  <button class="btn ghost" type="button" id="btn-reset">Reiniciar el prototipo</button>`;
}

function render(){
  const v = document.getElementById("view");
  v.innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${{reg:viewReg,pre:viewPre,ale:viewAle,apr:viewApr}[S.tab]()}</div>`;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===S.tab));
  const unseen = S.alerts.filter(a=>!a.seen).length, badge=document.getElementById("badge");
  badge.hidden = !unseen; badge.textContent = unseen;
  bind();
}
function bind(){
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f;};
  on("go-pre",()=>setTab("pre"));
  on("tipo-g",()=>{S.tipo="Gasto";S.err=null;render();});
  on("tipo-i",()=>{S.tipo="Ingreso";S.err=null;render();});
  on("btn-reg",submit);
  const d=document.getElementById("in-monto"); if(d) d.onkeydown=e=>{if(e.key==="Enter")submit();};
  const ds=document.getElementById("in-desc"); if(ds) ds.onkeydown=e=>{if(e.key==="Enter")document.getElementById("in-monto").focus();};
  const ex=[{d:"empanadas",v:"6000"},{d:"almuerso corrientazo",v:"16000"},{d:"cervezas con amigos",v:"48000"},{d:"tinto",v:"4000"},{d:"canva pro",v:"32000"},{d:"regalo para mi mamá",v:"60000"},{d:"pago cliente branding",v:"900000",tipo:"Ingreso"}];
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{const e=ex[+b.dataset.ex]; tryExample({d:e.d,tipo:e.tipo},e.v);});
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.pending.sel=b.dataset.cat; render();});
  on("btn-ok",confirmPending);
  on("btn-cancel",()=>{S.pending=null;render();});
  on("pf-free",()=>{S.perfil="free";render();});
  on("pf-emp",()=>{S.perfil="emp";render();});
  const m=document.getElementById("cfg-meta"); if(m) m.onchange=()=>{S.meta=parseInt(m.value.replace(/\D/g,""),10)||0;render();};
  const r=document.getElementById("cfg-res"); if(r) r.onchange=()=>{S.reservaPct=Math.min(100,parseInt(r.value.replace(/\D/g,""),10)||0);render();};
  document.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{const a=S.alerts[+b.dataset.fb]; a.fb=a.fb===b.dataset.v?null:b.dataset.v; render();});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.memory.splice(+b.dataset.rm,1); render();});
  on("btn-reset",()=>{S=initialState(); evalRules(); S.alerts.forEach(a=>a.seen=false); render();});
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
evalRules();
render();
</script>

</body></html>
